apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NavabShariff/python-web-app
    targetRevision: dev
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
     - ApplyOutOfSync=true
    automated:
      selfHeal: true